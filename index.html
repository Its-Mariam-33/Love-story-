<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حكايتنا ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#2b0717,#710f36,#190713);color:white;font-family:Arial,sans-serif;text-align:center;min-height:100vh;padding:30px 18px}
.card{max-width:450px;margin:25px auto;padding:28px 20px;border:1px solid #ffffff40;border-radius:25px;background:#ffffff12;box-shadow:0 10px 40px #0005}
.heart{font-size:65px;animation:pulse 1s infinite}
h1{color:#ffb5cf}
p{line-height:2;font-size:18px}
button{background:#ed679b;color:white;border:0;border-radius:25px;padding:13px 24px;font-size:17px;margin:8px;cursor:pointer}
#message{display:none;background:#ffffff12;padding:15px;border-radius:15px}
@keyframes pulse{50%{transform:scale(1.13)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1>حكاية حب جميلة</h1>
<p>في وسط كل الناس، فيه حكايات بتكون مختلفة ومميزة... ودي بداية حكايتنا 💗</p>
<button onclick="showMessage()">افتح رسالتي 💌</button>
<div id="message">
<p>وجودك بيخلّي الأيام أحلى، وكل ذكرى جميلة بتفضل عايشة في القلب ❤️</p>
<p>ودي لسه البداية... 🥹💕</p>
</div>
<p>💖 حكاية تستاهل تتحكي 💖</p>
</div>
<script>
function showMessage(){
document.getElementById('message').style.display='block';
}
</script>
</body>
</html>
